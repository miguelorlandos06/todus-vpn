name: build-apk

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Validar y compilar APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Flutter 3.27.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: stable
          cache: true

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Dependencias
        run: flutter pub get

      - name: Analizar (0 errores, 0 avisos)
        run: flutter analyze --fatal-infos

      - name: Pruebas
        run: flutter test

      - name: Versión
        id: ver
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - name: Compilar APK (release AOT, solo armeabi-v7a)
        run: flutter build apk --release --target-platform android-arm

      - name: Preparar APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            "dist/ToDusVPN-RTC-v${{ steps.ver.outputs.version }}.apk"
          ls -la dist

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: dist/*.apk

      - name: Crear Release con la APK (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "dist/ToDusVPN-RTC-v${{ steps.ver.outputs.version }}.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ToDus Relay VPN (RTC) ${GITHUB_REF_NAME}" \
            --generate-notes
